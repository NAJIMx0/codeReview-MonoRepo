services:
  postgres:
    container_name: ms_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: najim
      POSTGRES_PASSWORD: najim
      POSTGRES_DB: auth_db
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "false"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - microservices-net
    restart: unless-stopped

  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=najim
      - MONGO_INITDB_ROOT_PASSWORD=najim
    networks:
      - microservices-net

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://najim:najim@mongo_db:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=najim
      - ME_CONFIG_BASICAUTH_PASSWORD=najim
    depends_on:
      - mongodb
    networks:
      - microservices-net



  config-server:
    container_name: config-server
    build:
      context: ./services/config-server
    ports:
      - 8888:8888
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-service:
    container_name: discovery-service
    build:
      context: ./services/discovery-service
    ports:
      - 8761:8761
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-service
    ports:
      - 8080:8080
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - EUREKA_INSTANCE_HOSTNAME=auth-service
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    restart: unless-stopped

  webhook-service:
    container_name: webhook-service
    build:
      context: ./services/webhook-service
    ports:
      - 8999:8999
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATA_MONGODB_URI=mongodb://najim:najim@mongo_db:27017/webhook_db?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - EUREKA_INSTANCE_HOSTNAME=webhook-service
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    restart: unless-stopped

  generate-service:
    container_name: generate-service
    build:
      context: ./services/generate-service
    ports:
      - 8998:8998
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka
      - EUREKA_INSTANCE_HOSTNAME=generate-service
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: unless-stopped


  orchestrator:
    container_name: orchestrator
    build:
      context: ./services/orchestrator
    ports:
      - 8181:8000
    networks:
      - microservices-net
    depends_on:
      complexity-service:
        condition: service_started
      style-service:
        condition: service_started
      duplication-service:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - COMPLEXITY_URL=http://complexity-service:8001
      - STYLE_URL=http://style-service:8002
      - DUPLICATION_URL=http://duplication-service:8003
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_REVIEW_TOPIC=review.result
    restart: unless-stopped

  ai-review-service:
    container_name: ai-review-service
    build:
      context: ./services/ai-review-service
    networks:
      - microservices-net
    depends_on:
      kafka:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INPUT_TOPIC=review.result
      - OUTPUT_TOPIC=review.result.ai
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
    restart: unless-stopped

  complexity-service:
    container_name: complexity-service
    build:
      context: ./services/complexity-service
    networks:
      - microservices-net
    restart: unless-stopped

  style-service:
    container_name: style-service
    build:
      context: ./services/style-service
    networks:
      - microservices-net
    restart: unless-stopped

  duplication-service:
    container_name: duplication-service
    build:
      context: ./services/duplication-service
    networks:
      - microservices-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - microservices-net
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongo:
