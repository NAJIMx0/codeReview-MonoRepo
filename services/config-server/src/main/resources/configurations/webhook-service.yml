server:
  port: 8999
spring:
  data:
    mongodb:
      uri:   mongodb://najim:najim@mongo_db:27017/webhook_db?authSource=admin

eureka:
  instance:
    hostname: webhook-service
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka



