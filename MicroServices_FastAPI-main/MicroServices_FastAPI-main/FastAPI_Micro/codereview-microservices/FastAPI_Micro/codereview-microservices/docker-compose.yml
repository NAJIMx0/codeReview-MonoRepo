version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CodeReview AI — Microservices Stack
#
# Ports exposed on the HOST:
#   8000  →  orchestrator      (Spring Boot sends code here)
#   8001  →  complexity-service
#   8002  →  style-service
#   8003  →  duplication-service
#
# The three analysis services are on an internal network only reachable by
# the orchestrator. Spring Boot (and Postman) only ever needs to talk to :8000.
#
# To set the Spring Boot callback URL, either:
#   a) export SPRINGBOOT_CALLBACK=http://your-springboot:8080/api/review/result
#   b) include "callbackUrl" in the JSON body of each /analyze request
# ─────────────────────────────────────────────────────────────────────────────

networks:
  internal:           # orchestrator ↔ microservices
    driver: bridge
  external_access:    # orchestrator ↔ Spring Boot / Postman
    driver: bridge

services:

  # ── Orchestrator ────────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./orchestrator
    container_name: codereview-orchestrator
    ports:
      - "8000:8000"
    environment:
      COMPLEXITY_URL:      http://complexity-service:8001
      STYLE_URL:           http://style-service:8002
      DUPLICATION_URL:     http://duplication-service:8003
      # Override this with your real Spring Boot callback endpoint:
      SPRINGBOOT_CALLBACK: ${SPRINGBOOT_CALLBACK:-}
    depends_on:
      complexity-service:
        condition: service_healthy
      style-service:
        condition: service_healthy
      duplication-service:
        condition: service_healthy
    networks:
      - internal
      - external_access
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Complexity Service ───────────────────────────────────────────────────────
  complexity-service:
    build:
      context: ./complexity-service
    container_name: codereview-complexity
    ports:
      - "8001:8001"   # exposed so Postman can hit it directly during testing
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Style Service ────────────────────────────────────────────────────────────
  style-service:
    build:
      context: ./style-service
    container_name: codereview-style
    ports:
      - "8002:8002"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Duplication Service ──────────────────────────────────────────────────────
  duplication-service:
    build:
      context: ./duplication-service
    container_name: codereview-duplication
    ports:
      - "8003:8003"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
